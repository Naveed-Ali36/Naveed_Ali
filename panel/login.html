<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="assets/panel.css">
</head>
<body class="login-wrap">
  <div class="login-card">
    <h1>Portfolio Admin</h1>
    <p style="color:#94a3b8;margin:1rem 0 1.5rem">Login with your Supabase account</p>
    <div id="alert"></div>
    <form id="login-form">
      <label>Email<input type="email" name="email" required placeholder="naveed.ali35824@gmail.com"></label>
      <label>Password<input type="password" name="password" required></label>
      <button class="btn btn-primary" type="submit" id="login-btn" style="width:100%;justify-content:center;margin-top:.5rem">Login</button>
    </form>
    <p style="color:#64748b;font-size:.85rem;margin-top:1rem">Supabase → Authentication → Users se user banayein</p>
  </div>

  <script src="assets/config.js"></script>
  <script type="module">
    import { getSupabase, getSession, showAlert } from './assets/panel.js';

    const alert = document.getElementById('alert');
    const btn = document.getElementById('login-btn');

    if (new URLSearchParams(location.search).get('error') === 'config') {
      showAlert(alert, 'error', 'Supabase config error. Refresh page or check Vercel env variables.');
    }

    try {
      const session = await getSession();
      if (session) location.href = 'dashboard.html';
    } catch (err) {
      showAlert(alert, 'error', err.message || 'Could not connect to Supabase.');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      alert.className = '';
      alert.textContent = '';

      try {
        const fd = new FormData(e.target);
        const supabase = await getSupabase();
        const { data, error } = await supabase.auth.signInWithPassword({
          email: String(fd.get('email')).trim(),
          password: String(fd.get('password'))
        });

        if (error) {
          showAlert(alert, 'error', error.message);
          return;
        }

        if (!data.session) {
          showAlert(alert, 'error', 'Login failed. Confirm your email in Supabase or disable email confirmation in Auth settings.');
          return;
        }

        location.href = 'dashboard.html';
      } catch (err) {
        showAlert(alert, 'error', err.message || 'Login failed. Try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
