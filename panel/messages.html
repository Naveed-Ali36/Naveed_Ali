<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <link rel="stylesheet" href="assets/panel.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Portfolio Admin</h2>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="content.html">Edit Content</a>
        <a href="messages.html" class="active">Messages</a>
        <a href="/" target="_blank">View Site</a>
        <a href="#" id="logout">Logout</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar"><h1>Messages</h1></div>
      <div class="card"><div id="list">Loading...</div></div>
    </main>
  </div>
  <script type="module">
    import { requireAuth, apiFetch, logout } from './assets/panel.js';
    await requireAuth();
    document.getElementById('logout').onclick = (e) => { e.preventDefault(); logout(); };

    async function load() {
      const data = await apiFetch('/api/admin/messages');
      const list = document.getElementById('list');
      if (!data.success || !data.messages?.length) {
        list.innerHTML = '<p style="color:#94a3b8">No messages yet.</p>';
        return;
      }
      list.innerHTML = `<table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Project</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody>${
        data.messages.map(m => `<tr>
          <td>${m.created_at || ''}</td>
          <td>${m.name}</td>
          <td><a href="mailto:${m.email}">${m.email}</a></td>
          <td>${m.project_type || '-'}</td>
          <td>${m.message}</td>
          <td>${m.read ? 'Read' : '<strong style="color:#f59e0b">New</strong>'}</td>
          <td>
            ${!m.read ? `<button class="btn btn-secondary btn-sm" data-read="${m.id}">Mark read</button>` : ''}
            <button class="btn btn-danger btn-sm" data-del="${m.id}">Delete</button>
          </td>
        </tr>`).join('')
      }</tbody></table>`;

      list.querySelectorAll('[data-read]').forEach(btn => btn.onclick = async () => {
        await apiFetch('/api/admin/messages', { method: 'PATCH', body: JSON.stringify({ id: btn.dataset.read, read: true }) });
        load();
      });
      list.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
        if (!confirm('Delete message?')) return;
        await apiFetch('/api/admin/messages', { method: 'DELETE', body: JSON.stringify({ id: btn.dataset.del }) });
        load();
      });
    }
    load();
  </script>
</body>
</html>
